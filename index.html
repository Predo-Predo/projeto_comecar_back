<!DOCTYPE html>
<html>
<head>
  <base href="/projeto_comecar_back/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="A new Flutter project.">

  <!-- Google Identity Services -->
  <meta name="google-signin-client_id" content="669723152550-94kktlea6u9enh9tctf6qh8lb50hg65n.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>frontend</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Função que o Flutter chama para abrir o login Google
    function showGoogleLogin() {
      google.accounts.id.initialize({
        client_id: '669723152550-94kktlea6u9enh9tctf6qh8lb50hg65n.apps.googleusercontent.com',
        callback: (response) => {
          const event = new CustomEvent('googleLogin', { detail: response.credential });
          window.dispatchEvent(event);
        },
        ux_mode: 'popup'
      });

      google.accounts.id.prompt((notification) => {
        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
          google.accounts.id.disableAutoSelect();
          google.accounts.id.prompt();
        }
      });
    }
  </script>

  <!-- Bootstrap do Flutter -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
